# 手元の PostgreSQL への接続。compose.yaml と build.gradle.kts の flyway ブロックが
# 同じ値を持つ。3 か所に出るのは、それぞれ見る主体が違うためである——
# compose は DB を立てる側、flyway ブロックは codegen の前にスキーマを入れる側、
# ここは起動したアプリが使う側。
#
# 実運用の接続先はここに書かない。recibir-ops が持つ（判断は #1）。
spring:
  datasource:
    url: jdbc:postgresql://localhost:15432/recibir
    username: recibir
    password: recibir

# 構造化ログを 1 行の JSON で stdout へ出す（#5）。形式の定義と、組み込みの ecs を
# 使わなかった理由は config/CloudLoggingFormat.kt にある。
#
# これは docs/SPEC.md §5 の「設定項目」ではない。あちらが増やさないと決めているのは
# sendgrid.* であり、ログの出力先や形式を運用側が差し替えられるようにするものでもない
# ——値はここに固定してあり、環境変数で切り替わる余地を作っていない。
logging:
  structured:
    format:
      console: io.propagandist.recibir.config.CloudLoggingFormat

# 受信に必要な設定はこれだけである（docs/SPEC.md §5）。
# 値は SendGrid の管理画面 Settings > Mail Settings > Signed Event Webhook Requests に出る。
#
# 既定値を書かない。空を既定にすると鍵を設定し忘れたまま起動でき、
# 全イベントが 403 で弾かれるのに何も落ちない状態になる（README「最も気づきにくい障害」）。
# 環境変数が無ければ、ここで起動が止まる。
sendgrid:
  webhook:
    public-key: ${SENDGRID_WEBHOOK_PUBLIC_KEY}
  # Suppression API との突き合わせ（docs/SPEC.md §4.5）が使う。
  # ここも既定値を書かない。空を既定にすると、キーを設定し忘れたまま起動でき、
  # 突き合わせが 401 で失敗し続けるのに受信だけは動いている状態になる。
  api:
    key: ${SENDGRID_API_KEY}

# OAuth を使うときだけ、認可サーバの issuer を渡す（docs/SPEC.md §4.6）。
#
#   SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI=https://...
#
# ここにキーを書かない。書けば値が要り、渡さない人が起動できなくなる——
# OAuth を使わない側が既定なので、使わない人に設定を強いることになる。
# 入口を issuer-uri の 1 つに決めた理由は config/SendGridOAuthSecurityConfig.kt にある。
#
# これも docs/SPEC.md §5 の「設定項目」ではない。§5 が増やさないと決めているのは
# sendgrid.* であり、上のログの出力形式と同じ扱いである。
